# Self-healing database check: every 6 hours, ping the database; if it's
# unreachable (free-tier auto-pause), restore the project via the Supabase
# Management API and wait until it's back.
# Requires repo secret SUPABASE_ACCESS_TOKEN (a Supabase personal access token).
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database, restore if paused
        run: |
          KEY="sb_publishable_cYDS2NUdm9fx1jEjD0jXxA_oc8iIH3z"
          URL="https://nyztolzbtfsphbhyjpnv.supabase.co/rest/v1/settings?select=id"
          ping() { curl -sf --max-time 20 "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null; }

          if ping; then
            echo "Database awake"
            exit 0
          fi

          echo "Database unreachable — attempting restore"
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — cannot auto-restore"
            exit 1
          fi

          curl -sf -X POST "https://api.supabase.com/v1/projects/nyztolzbtfsphbhyjpnv/restore" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" -d '{}' \
            || { echo "::error::Restore API call failed"; exit 1; }

          echo "Restore requested — waiting for database"
          for i in $(seq 1 30); do
            sleep 20
            if ping; then
              echo "Database restored"
              exit 0
            fi
          done
          echo "::error::Database did not come back within 10 minutes"
          exit 1
