# Pings the database twice a week so the free-tier Supabase project
# never hits the 7-day inactivity auto-pause.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4' # Mon & Thu 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          KEY="sb_publishable_cYDS2NUdm9fx1jEjD0jXxA_oc8iIH3z"
          curl -sf "https://nyztolzbtfsphbhyjpnv.supabase.co/rest/v1/settings?select=id" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Database pinged successfully"
